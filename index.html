<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator_project</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
			<div class="time">10:33</div>
			<article class="big_container">
				<input type="text" id="text_Input" class="input-text" />
				<div class="button_container" id="btn_container">
					<div class="small_container">
						<button id="clear_All">A/C</button>
						<button id="clear">C</button>
						<button id="remainder">%</button>
					</div>
					<button id="one">1</button>
					<button id="two">2</button>
					<button id="three">3</button>
					<button id="divide">/</button>
					<button id="four">4</button>
					<button id="five">5</button>
					<button id="six">6</button>
					<button id="multiply">x</button>
					<button id="seven">7</button>
					<button id="eight">8</button>
					<button id="nine">9</button>
					<button id="subtract">-</button>
					<button id="zero">0</button>
					<button id="point">.</button>
					<button id="equal">=</button>
					<button id="addition">+</button>
				</div>
			</article>
		</main>
		<script src="index.js"></script>
	</body>
</html>
