<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator_project</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
			<div class="time">10:33</div>
			<article class="big_container">
				<input type="text" id="text_Input" class="input-text" />
				<div class="button_container" id="btn_container">
					<div class="small_container">
						<button id="clear_All">A/C</button>
						<button id="clear">C</button>
						<button id="operatorBtn">%</button>
					</div>
					<button class="num">1</button>
					<button class="num">2</button>
					<button class="num">3</button>
					<button id="operatorBtn">/</button>
					<button class="num">4</button>
					<button class="num">5</button>
					<button class="num">6</button>
					<button id="operatorBtn">x</button>
					<button class="num">7</button>
					<button class="num">8</button>
					<button class="num">9</button>
					<button id="operatorBtn">-</button>
					<button class="num">0</button>
					<button id="operatorBtn">.</button>
					<button id="equal">=</button>
					<button id="operatorBtn">+</button>
				</div>
			</article>
		</main>
		<script src="index.js"></script>
	</body>
</html>
