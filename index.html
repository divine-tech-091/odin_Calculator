<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator_project</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
			<div class="time">10:33</div>
			<article class="big_container">
				<input type="text" id="text_Input" class="input-text" value="0" />
				<div class="button_container" id="btn_container">
					<div class="small_container">
						<div class="inner_container">
							<button data-action="clear_All">A/C</button>
							<button data-action="clear_space">C</button>
						</div>
					</div>
					<button>1</button>
					<button>2</button>
					<button>3</button>
					<button class="key--operator" data-action="divide">/</button>
					<button>4</button>
					<button>5</button>
					<button>6</button>
					<button class="key--operator" data-action="multiply">*</button>
					<button>7</button>
					<button>8</button>
					<button>9</button>
					<button class="key--operator" data-action="subtract">-</button>
					<button>0</button>
					<button data-action="decimal">.</button>
					<button class="key--equal" data-action="calculate">=</button>
					<button class="key--operator" data-action="add">+</button>
				</div>
			</article>
		</main>
		<script src="index.js"></script>
	</body>
</html>
